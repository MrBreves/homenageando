name: OpenAI Ads integration checks

on:
  push:
    branches:
      - feat/openai-ads-conversions
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Conversion unit tests
        run: node --test tests/openai-conversions.test.mjs tests/openai-conversions-worker.test.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: integration-test-placeholder
          NEXT_PUBLIC_SITE_URL: https://www.homenageando.com.br
        run: npm run build
